name: Seed first admin

# Run manually from the Actions tab AFTER the repo secrets are set:
#   MONGODB_URI, ADMIN_NAME, ADMIN_EMAIL, ADMIN_PASSWORD
# The seed script refuses to run if any are missing, and never prints the password.
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Seed first admin
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npm run seed:admin
